spring.application.name=givelives

# Database connection (values come from environment variables)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

spring.jpa.open-in-view=false

# Business rules
givelives.platform-fee-percent=10
givelives.min-campaign-goal=1000
givelives.payout-review-threshold=50000

givelives.jwt.secret=${JWT_SECRET}
givelives.jwt.expiration-minutes=60


givelives.campaign-min-days=7
givelives.campaign-max-days=90

#razorpay 
givelives.razorpay.key-id=${RAZORPAY_KEY_ID}
givelives.razorpay.key-secret=${RAZORPAY_KEY_SECRET}
givelives.razorpay.webhook-secret=${RAZORPAY_WEBHOOK_SECRET:not-set-yet}

givelives.min-donation-amount=100
givelives.pending-donation-expiry-minutes=30